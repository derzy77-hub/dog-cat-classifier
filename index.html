<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>개 vs 고양이 판별기</title>
<style>
  body {
    font-family: -apple-system, "Malgun Gothic", sans-serif;
    background: #f7f7f8;
    margin: 0;
    display: flex;
    justify-content: center;
    padding: 40px 16px;
  }
  .card {
    background: #fff;
    border-radius: 16px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.08);
    padding: 32px;
    width: 100%;
    max-width: 480px;
    text-align: center;
  }
  h1 { font-size: 22px; margin-bottom: 4px; }
  .subtitle { color: #666; font-size: 13px; margin-bottom: 24px; }
  #dropzone {
    border: 2px dashed #ccc;
    border-radius: 12px;
    padding: 24px;
    cursor: pointer;
    color: #888;
    transition: border-color 0.2s;
  }
  #dropzone.drag { border-color: #4a7dff; color: #4a7dff; }
  #preview {
    max-width: 100%;
    max-height: 280px;
    border-radius: 12px;
    margin-top: 16px;
    display: none;
  }
  #fileInput { display: none; }
  button {
    margin-top: 20px;
    padding: 12px 28px;
    border: none;
    border-radius: 999px;
    background: #4a7dff;
    color: #fff;
    font-size: 15px;
    cursor: pointer;
  }
  button:disabled { background: #bbc7e6; cursor: not-allowed; }
  #result {
    margin-top: 24px;
    min-height: 24px;
    font-size: 15px;
  }
  .result-main {
    font-size: 28px;
    font-weight: 700;
    margin-bottom: 6px;
  }
  .result-sub { color: #777; font-size: 13px; }
  #status { color: #999; font-size: 13px; margin-top: 8px; }
</style>
</head>
<body>
  <div class="card">
    <h1>🐶 개 vs 고양이 판별기 🐱</h1>
    <div class="subtitle">이미지를 업로드하면 개인지 고양이인지 판별합니다</div>

    <div id="dropzone">
      이미지를 드래그하거나 클릭해서 선택하세요
      <input type="file" id="fileInput" accept="image/*">
    </div>
    <img id="preview">

    <div>
      <button id="classifyBtn" disabled>판별하기</button>
    </div>

    <div id="status">모델을 불러오는 중입니다...</div>
    <div id="result"></div>
  </div>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.20.0/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/mobilenet@2.1.1/dist/mobilenet.min.js"></script>
<script>
const DOG_BREEDS = [
  "chihuahua","japanese spaniel","maltese dog","pekinese","shih-tzu","blenheim spaniel",
  "papillon","toy terrier","rhodesian ridgeback","afghan hound","basset","beagle",
  "bloodhound","bluetick","black-and-tan coonhound","walker hound","english foxhound",
  "redbone","borzoi","irish wolfhound","italian greyhound","whippet","ibizan hound",
  "norwegian elkhound","otterhound","saluki","scottish deerhound","weimaraner",
  "staffordshire bullterrier","american staffordshire terrier","bedlington terrier",
  "border terrier","kerry blue terrier","irish terrier","norfolk terrier","norwich terrier",
  "yorkshire terrier","wire-haired fox terrier","lakeland terrier","sealyham terrier",
  "airedale","cairn","australian terrier","dandie dinmont","boston bull",
  "miniature schnauzer","giant schnauzer","standard schnauzer","scotch terrier",
  "tibetan terrier","silky terrier","soft-coated wheaten terrier",
  "west highland white terrier","lhasa","flat-coated retriever","curly-coated retriever",
  "golden retriever","labrador retriever","chesapeake bay retriever",
  "german short-haired pointer","vizsla","english setter","irish setter","gordon setter",
  "brittany spaniel","clumber","english springer","welsh springer spaniel","cocker spaniel",
  "sussex spaniel","irish water spaniel","kuvasz","schipperke","groenendael","malinois",
  "briard","kelpie","komondor","old english sheepdog","shetland sheepdog","collie",
  "border collie","bouvier des flandres","rottweiler","german shepherd","doberman",
  "miniature pinscher","greater swiss mountain dog","bernese mountain dog","appenzeller",
  "entlebucher","boxer","bull mastiff","tibetan mastiff","french bulldog","great dane",
  "saint bernard","eskimo dog","malamute","siberian husky","affenpinscher","basenji","pug",
  "leonberg","newfoundland","great pyrenees","samoyed","pomeranian","chow","keeshond",
  "brabancon griffon","pembroke","cardigan","toy poodle","miniature poodle",
  "standard poodle","mexican hairless","dingo","dhole","african hunting dog"
];
const CAT_BREEDS = ["tabby","tiger cat","persian cat","siamese cat","egyptian cat"];

function matchCategory(className) {
  const name = className.toLowerCase();
  if (DOG_BREEDS.some(b => name.includes(b))) return "dog";
  if (CAT_BREEDS.some(b => name.includes(b))) return "cat";
  return null;
}

const dropzone = document.getElementById("dropzone");
const fileInput = document.getElementById("fileInput");
const preview = document.getElementById("preview");
const classifyBtn = document.getElementById("classifyBtn");
const statusEl = document.getElementById("status");
const resultEl = document.getElementById("result");

let model = null;

async function loadModel() {
  model = await mobilenet.load();
  statusEl.textContent = "이미지를 선택하고 판별하기를 눌러주세요";
}
loadModel();

function handleFile(file) {
  if (!file || !file.type.startsWith("image/")) return;
  const url = URL.createObjectURL(file);
  preview.src = url;
  preview.style.display = "block";
  resultEl.innerHTML = "";
  classifyBtn.disabled = !model;
}

dropzone.addEventListener("click", () => fileInput.click());
fileInput.addEventListener("change", e => handleFile(e.target.files[0]));

["dragover", "dragleave", "drop"].forEach(evt => {
  dropzone.addEventListener(evt, e => {
    e.preventDefault();
    dropzone.classList.toggle("drag", evt === "dragover");
    if (evt === "drop") handleFile(e.dataTransfer.files[0]);
  });
});

classifyBtn.addEventListener("click", async () => {
  if (!model || !preview.src) return;
  classifyBtn.disabled = true;
  statusEl.textContent = "판별 중...";
  resultEl.innerHTML = "";

  await preview.decode();
  const predictions = await model.classify(preview, 5);
  let category = null;
  let matchedPred = null;
  for (const p of predictions) {
    category = matchCategory(p.className);
    if (category) { matchedPred = p; break; }
  }

  if (category) {
    const label = category === "dog" ? "🐶 개입니다" : "🐱 고양이입니다";
    const pct = (matchedPred.probability * 100).toFixed(1);
    resultEl.innerHTML = `
      <div class="result-main">${label}</div>
      <div class="result-sub">인식된 품종: ${matchedPred.className} (${pct}%)</div>
    `;
  } else {
    const top = predictions[0];
    resultEl.innerHTML = `
      <div class="result-main">🤔 판별 불가</div>
      <div class="result-sub">개/고양이가 아닌 것 같습니다 (가장 유사: ${top.className}, ${(top.probability*100).toFixed(1)}%)</div>
    `;
  }
  statusEl.textContent = "다른 이미지도 판별해보세요";
  classifyBtn.disabled = false;
});
</script>
</body>
</html>
